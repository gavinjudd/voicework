name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python compiles
        run: python -m compileall -q voicework scripts
      - name: Browser module tests and syntax
        run: |
          node --version
          node --test tests/*.js
          node --check web/app.js
          for f in web/*.mjs extension/*.js extension/*.mjs; do node --check "$f"; done
